{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{% block description %}Notes on web development, Django, and building real projects.{% endblock %}">
    <meta name="theme-color" content="#0f1519">
    <title>{% block title %}Blog | RojasWebs{% endblock %}</title>
    <link rel="alternate" type="application/rss+xml" title="RojasWebs Blog" href="{% url 'website:blog_feed' %}">
    <link rel="icon" type="image/png" sizes="256x256" href="{% static 'website/images/rw-mark-red.png' %}">
    <link rel="apple-touch-icon" href="{% static 'website/images/rw-mark-red.png' %}">
    {% include 'website/_theme_init.html' %}
    <link rel="stylesheet" href="{% static 'website/css/style.css' %}?v=self-hosted-fonts-1">
    <script src="{% static 'website/js/main.js' %}?v=dark-mode-1" defer></script>
</head>
<body>
    <a class="skip-link" href="#main-content">Skip to content</a>

    <header class="site-header">
        <a class="brand" href="{% url 'website:home' %}#about" aria-label="RojasWebs home">
            <img class="brand-mark" src="{% static 'website/images/rw-mark-red.png' %}" alt="" width="40" height="40">
            <span><span class="brand-rojas">Rojas</span>Webs</span>
        </a>

        <nav id="site-nav" class="site-nav" aria-label="Main navigation">
            <a href="{% url 'website:home' %}#about">About</a>
            <a href="{% url 'website:home' %}#learning">Learning</a>
            <a href="{% url 'website:home' %}#projects">Projects</a>
            <a href="{% url 'website:blog' %}" aria-current="page">Blog</a>
            <a href="{% url 'website:home' %}#contact">Contact</a>
        </nav>

        {% include 'website/_theme_toggle.html' %}

        <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
            <span class="sr-only">Toggle navigation</span>
            <span></span><span></span><span></span>
        </button>
    </header>

    <main id="main-content" class="blog-main">
        {% block content %}{% endblock %}
    </main>

    {% include 'website/_footer.html' %}
</body>
</html>
